{# Píldora del estado de una devolución. Variable: d #}
{% if not d.activo %}<span class="bg-gray-200 text-gray-600 text-[11px] px-3 py-1 rounded-full font-bold whitespace-nowrap">Anulada</span>
{% elif d.estado == 'Pendiente' %}<span class="bg-yellow-100 text-yellow-700 text-[11px] px-3 py-1 rounded-full font-bold whitespace-nowrap">Pendiente</span>
{% elif d.estado == 'Aprobada' %}<span class="bg-blue-100 text-blue-700 text-[11px] px-3 py-1 rounded-full font-bold whitespace-nowrap">Aprobada</span>
{% elif d.estado == 'Rechazada' %}<span class="bg-red-100 text-red-600 text-[11px] px-3 py-1 rounded-full font-bold whitespace-nowrap">Rechazada</span>
{% else %}<span class="bg-green-100 text-green-600 text-[11px] px-3 py-1 rounded-full font-bold whitespace-nowrap">Completada</span>{% endif %}
