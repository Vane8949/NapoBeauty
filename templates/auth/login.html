{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Napo Beauty</title>
    
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="login-bg items-center justify-center relative overflow-hidden">

    <!-- Contenedor Principal Centrado -->
    <div class="w-full max-w-md p-8 relative z-20 flex flex-col items-center">
        
        <!-- Logo -->
        <div class="w-24 h-24 bg-white rounded-full flex flex-col items-center justify-center shadow-sm border border-pink-50 overflow-hidden mb-5">
            <img src="{% static 'img/logo.png' %}" alt="Logo Napo Beauty" class="w-full h-full object-cover">
        </div>

        <!-- Títulos -->
        <h1 class="text-[1.7rem] font-bold text-[#1f2937] mb-1">Bienvenido de nuevo</h1>
        <p class="text-gray-500 text-sm mb-8 font-medium">Inicia sesión en tu cuenta</p>

        <!-- Contenedor visual (Corregido con Tailwind puro) -->
        <div class="w-full space-y-5 relative z-20">
            
            <!-- Campo Correo -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Correo electrónico o usuario</label>
                <div class="relative w-full">
                    <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Ingresa tu correo o usuario" class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-100 transition-all">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña</label>
                <div class="relative w-full">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="passwordInput" placeholder="Ingresa tu contraseña" class="w-full pl-11 pr-10 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-100 transition-all">
                    <i class="fa-regular fa-eye-slash absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600 transition-colors" id="togglePassword"></i>
                </div>
            </div>

            <!-- Opciones extra -->
            <div class="flex items-center justify-between mt-2 mb-4">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" class="rounded border-gray-300 text-pink-500 focus:ring-pink-500 w-4 h-4">
                    Recordar sesión
                </label>
                <a href="#" class="text-sm font-medium text-pink-500 hover:text-pink-600 hover:underline">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- BOTÓN ALINEADO Y CON Z-INDEX -->
            <a href="{% url 'dashboard' %}" class="w-full bg-gradient-to-r from-pink-400 to-pink-600 text-white font-bold py-3.5 rounded-xl shadow-[0_8px_20px_-6px_rgba(219,39,119,0.5)] hover:shadow-[0_12px_25px_-6px_rgba(219,39,119,0.6)] hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 cursor-pointer relative z-50 mt-2" style="text-decoration: none;">
                Iniciar sesión <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <!-- Divisor "o" -->
        <div class="flex items-center w-full my-7">
            <div class="flex-1 border-t border-gray-200"></div>
            <span class="px-4 text-gray-400 text-xs font-semibold uppercase tracking-wider">o</span>
            <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <!-- Botones Sociales -->
        <div class="w-full space-y-3 relative z-20">
            <button class="btn-social">
                <img src="https://cdn.iconscout.com/icon/free/png-256/free-google-1772223-1507807.png" alt="Google" class="w-5 h-5">
                Continuar con Google
            </button>
            <button class="btn-social">
                <i class="fa-brands fa-apple text-xl mb-1"></i>
                Continuar con Apple
            </button>
        </div>

        <!-- Enlace de Registro -->
        <p class="mt-8 text-sm text-gray-500 relative z-20">
            ¿No tienes una cuenta? <a href="#" class="text-pink-500 font-bold hover:underline">Regístrate</a>
        </p>

    </div>

    <!-- Decoración inferior (Brochas) -->
    <div class="absolute bottom-0 right-0 z-0 pointer-events-none transform translate-y-4">
        <img src="{% static 'img/brochas.png' %}" alt="Decoración" class="w-64 opacity-90 object-contain drop-shadow-xl" onerror="this.style.display='none'">
    </div>

    <!-- Decoración corazón (SVG estático) -->
    <div class="absolute bottom-12 right-64 z-0 pointer-events-none text-pink-300 opacity-60">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
    </div>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
