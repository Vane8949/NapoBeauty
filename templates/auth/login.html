{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Napo Beauty</title>
    
    <!-- CSS del Login -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    
    <!-- Librerías Externas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="login-bg items-center justify-center relative overflow-hidden">

    <!-- Contenedor Principal Centrado -->
    <div class="w-full max-w-md p-8 relative z-10 flex flex-col items-center">
        
        <!-- Logo -->
        <div class="w-24 h-24 bg-white rounded-full flex flex-col items-center justify-center shadow-sm border border-pink-100 overflow-hidden mb-6">
            <img src="{% static 'img/logo.png' %}" alt="Logo Napo Beauty" class="w-full h-full object-cover">
        </div>

        <!-- Títulos -->
        <h1 class="text-2xl font-extrabold text-gray-900 mb-1">Bienvenido de nuevo</h1>
        <p class="text-gray-500 text-sm mb-8">Inicia sesión en tu cuenta</p>

        <!-- Contenedor visual -->
        <div class="w-full space-y-4 relative z-20">
            
            <!-- Campo Correo -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico o usuario</label>
                <div class="input-icono-container">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="text" placeholder="Ingresa tu correo o usuario" class="input-auth">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <div class="input-icono-container">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Ingresa tu contraseña" class="input-auth">
                    <i class="fa-regular fa-eye-slash input-icono-derecha"></i>
                </div>
            </div>

            <!-- Opciones extra -->
            <div class="flex items-center justify-between mt-2 mb-6">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" class="rounded border-gray-300 text-pink-500 focus:ring-pink-500">
                    Recordar sesión
                </label>
                <a href="#" class="text-sm font-medium text-pink-500 hover:text-pink-600 underline-offset-2 hover:underline">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- BOTÓN CORREGIDO AL DASHBOARD -->
            <a href="{% url 'dashboard' %}" class="btn-auth-principal flex items-center justify-center gap-2 relative z-50 cursor-pointer" style="text-decoration: none; pointer-events: auto;">
                Iniciar sesión <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <!-- Divisor "o" -->
        <div class="flex items-center w-full my-6">
            <div class="flex-1 border-t border-gray-300"></div>
            <span class="px-4 text-gray-400 text-sm font-medium">o</span>
            <div class="flex-1 border-t border-gray-300"></div>
        </div>

        <!-- Botones Sociales -->
        <div class="w-full space-y-3 relative z-20">
            <button class="btn-social">
                <img src="https://cdn.iconscout.com/icon/free/png-256/free-google-1772223-1507807.png" alt="Google" class="w-5 h-5">
                Continuar con Google
            </button>
            <button class="btn-social">
                <i class="fa-brands fa-apple text-xl"></i>
                Continuar con Apple
            </button>
        </div>

        <!-- Enlace de Registro -->
        <p class="mt-8 text-sm text-gray-600 relative z-20">
            ¿No tienes una cuenta? <a href="#" class="text-pink-500 font-bold hover:underline">Regístrate</a>
        </p>

    </div>

    <!-- Script del Login para mostrar/ocultar contraseña -->
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
